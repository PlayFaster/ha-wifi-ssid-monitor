name: Release

"on":
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # Required to upload the HACS zip as a release asset
    # Branch @main — update SHA after pushing .github changes v2.0.14
    uses: PlayFaster/.github/.github/workflows/release.yaml@b12898ea9b0d954deaf2a099f6bb9fb1fd0bc041
    with:
      component_name: wifi_ssid_monitor
      tag: ${{ github.event.release.tag_name }}
