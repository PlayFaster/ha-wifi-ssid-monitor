name: Release

"on":
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # Required to upload the HACS zip as a release asset
    # Branch @main — update SHA after pushing .github changes v2.0.16
    uses: PlayFaster/.github/.github/workflows/release.yaml@7bbe12f5eb67b6f346a5619d7c5978c501f52907
    with:
      component_name: wifi_ssid_monitor
      tag: ${{ github.event.release.tag_name }}
