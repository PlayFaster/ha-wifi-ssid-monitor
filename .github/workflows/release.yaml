name: Release

"on":
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # Required to upload the HACS zip as a release asset
    # Branch @main — update SHA after pushing .github changes v2.0.17
    uses: PlayFaster/.github/.github/workflows/release.yaml@3f917d1c1a94420a1688a95c6d78c1ba91395835
    with:
      component_name: wifi_ssid_monitor
      tag: ${{ github.event.release.tag_name }}
