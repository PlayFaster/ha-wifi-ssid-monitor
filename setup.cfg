# SYNCED FILE — edit dev-workbench/workbench/python/setup.cfg and re-sync.
# The per-project module list is not here: the sync appends it below from the
# project's .validate/mutmut_modules.txt. No list, no file, skipped task.
# How to choose modules: info/test_better_docs/mutation_testing_setup.md
#
# Traps:
#  - List values must be newline-separated and indented. A comma-separated
#    only_mutate parses as one pattern matching nothing: zero mutants, no error.
#  - Paths use fnmatch from the project root, so */parse.py, not parse.py.
#  - Codespell reads this file in Validate All and fails on a malformed one.
#  - Never delete mutants/ — it is the cache and the results store. Changing
#    the list below does not require it.

[mutmut]
source_paths=custom_components

# Skip logging calls — a mutated log argument can only be killed by asserting
# log text, which is not worth doing.
do_not_mutate_patterns=
    _LOGGER\.\w+

only_mutate=
    */parse.py
    */diagnostics.py
    */health.py
