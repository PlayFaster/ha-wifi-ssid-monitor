# ============================================================================
#  SYNCED FILE — DO NOT EDIT IN A PROJECT.
#
#  This file is copied into every project by workbench/sync_shared_files.sh.
#  A local edit is silently overwritten on the next sync, taking any reasoning
#  with it. Edit the source instead:
#      dev-workbench/workbench/python/setup.cfg
#  and re-sync.
#
#  THE PER-PROJECT PART IS NOT HERE. The list of modules to mutate lives in
#  the project's own .validate/mutmut_modules.txt, which the sync appends
#  below. That file is yours to edit; this header block is not.
#
#  If a project has no .validate/mutmut_modules.txt, the sync writes no
#  setup.cfg at all and the mutation task reports itself skipped.
# ============================================================================
#
# Mutation testing configuration. Run it with the "Tests: Mutation Check" task.
#
# WHY THERE IS A LIST AT ALL
#
# Mutation testing only works on modules whose tests do not mock the thing
# being mutated. Measured on wifi_ssid_monitor, 2026-08-05: config_flow.py
# returned 82% surviving mutants, nearly all of them arguments to an API class
# that the tests replace with a mock — no test could ever detect those, so
# every one is noise you must read and discard. diagnostics.py, which mocks
# nothing, returned 39% and several were real gaps.
#
# So the list is the whole decision. Include a module when its tests exercise
# real code end to end; leave it out when they mock its collaborator.
#
# TWO SILENT FAILURE MODES, BOTH SEEN IN PRACTICE
#
# 1. EVERY list value here must be newline-separated and indented, as written
#    below. mutmut's documentation shows TOML array syntax against a setup.cfg
#    heading; those forms do not work here. The setup.cfg parser splits on
#    newlines only, so `only_mutate=a.py, b.py` becomes ONE pattern matching
#    nothing — zero mutants, no error, a run that proves nothing. Likewise
#    `do_not_mutate_patterns=['x']` becomes the regex `['x']`, a character
#    class matching almost every line. Verified against mutmut/configuration.py.
#
#    Paths use fnmatch from the project root, so a bare `parse.py` matches
#    nothing. Use `*/parse.py` or the full path.
#
# 2. This file is read by codespell, which runs in Validate All. A malformed
#    setup.cfg fails codespell outright rather than being skipped. If codespell
#    starts reporting "ill-formed config file", look here first.
#
# NEVER DELETE THE mutants/ DIRECTORY
#
# It is the cache AND the results store. mutmut re-tests only functions that
# changed since the last run, and `mutmut results` reads its verdicts from
# there. Deleting it discards findings that take the better part of an hour to
# produce, and one run's results were lost this way already.
#
# Changing the list below does NOT require deleting it. From mutmut's source:
# fields that only change which mutants exist are excluded from cache
# invalidation, because new mutants are born uncached and dropped ones simply
# stop being walked.

[mutmut]
source_paths=custom_components

# Skip logging calls. Mutating a log message's arguments produces a survivor
# that can only be killed by asserting log text, which is not worth doing.
# Measured: removes the logging lines and nothing else.
do_not_mutate_patterns=
    _LOGGER\.\w+

only_mutate=
    */parse.py
    */diagnostics.py
    */health.py
