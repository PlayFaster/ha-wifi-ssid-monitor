# IQS Quality Scale Assessment for WiFi SSID Monitor
# Generated: 2026-05-13 v1.1.0
# Updated: 2026-06-03 v1.2.0
rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment:
      No custom condition platform — no condition.py, conditions.yaml, or conditions
      block in strings.json. The integration exposes sensors, controls and actions only.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment:
      No custom trigger platform — no trigger.py, triggers.yaml, or triggers block in
      strings.json. The wifi_ssid_monitor_new_network bus event is documented in the
      README but is an event, not a trigger platform, so it does not change this. See
      .notes/issues/custom_trigger_condition/wifi_trigger_options.md for the analysis of
      adopting one.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: |
      No credentials to re-authenticate. The Supervisor token is read from the
      SUPERVISOR_TOKEN environment variable at call time and is never stored in
      the config entry or rendered into any schema, so no authentication can
      fail and ConfigEntryAuthFailed is never raised.
      async_step_reauth / async_step_reauth_confirm are retained and
      re-validate the interface if Home Assistant ever initiates the flow.
  test-coverage: done
  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Depends on discovery, which is exempt for this integration.
  discovery:
    status: exempt
    comment: Fixed HA Supervisor API endpoint; no mDNS or SSDP discovery needed.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment:
      No device tracker; static single-device architecture with 8 fixed entities. No HA
      device/entity instances are created after initial setup.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment:
      Network counts and SSID lists are static entities. No dynamic device instances to
      remove.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
